name: Maintenance credential check
on:
  push:
    branches: [main]
    paths: ['maintenance/credential-check.json']
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify scoped access
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "MAINTENANCE_TOKEN missing"; exit 1; }
          for repo in workbench Sunshine moonlight-qt moonlight-common-c; do
            echo "Checking mspeedo/$repo"
            gh api "repos/mspeedo/$repo" --jq '{name, permissions}'
            gh api "repos/mspeedo/$repo/actions/workflows" --jq '.total_count'
          done
          echo "Credential read access verified; write permissions not exercised."
